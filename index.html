<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片批量助手</title>
    <style>
        :root {
            --primary: #4a90e2;
            --bg: #f8fafe;
            --border: #e1e4e8;
        }

        body {
            font-family: -apple-system, system-ui, sans-serif;
            background-color: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: white;
            width: 100%;
            max-width: 800px;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        h1 {
            font-size: 1.25rem;
            color: #1a1a1a;
            margin: 0 0 20px 0;
            text-align: center;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            box-sizing: border-box;
            font-family: monospace;
            resize: vertical;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin: 15px 0;
        }

        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-preview { background: #6c757d; color: white; }
        .btn-download { background: var(--primary); color: white; }
        .btn-clear { background: #eee; color: #666; flex: 0.4; }
        button:hover { opacity: 0.9; }
        button:disabled { background: #ccc; cursor: not-allowed; }

        /* 预览区域 */
        #preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
        }

        .preview-item {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #eee;
            background: #fafafa;
        }

        #log {
            margin-top: 15px;
            font-size: 12px;
            color: #666;
            max-height: 80px;
            overflow-y: auto;
            border-top: 1px solid #eee;
            padding-top: 10px;
        }

        .progress {
            height: 4px;
            background: #eee;
            border-radius: 2px;
            margin: 10px 0;
            display: none;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>图片批量下载 & 预览</h1>
    
    <textarea id="input" placeholder="请在此粘贴链接，每行一个..."></textarea>

    <div class="progress" id="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>

    <div class="btn-group">
        <button class="btn-clear" onclick="clearAll()">清空</button>
        <button class="btn-preview" onclick="renderPreview()">预览图片</button>
        <button class="btn-download" id="dl-btn" onclick="runDownload()">执行下载</button>
    </div>

    <div id="preview-grid"></div>
    <div id="log"></div>
</div>

<script>
    const input = document.getElementById('input');
    const previewGrid = document.getElementById('preview-grid');
    const logArea = document.getElementById('log');

    function getUrls() {
        return input.value.split('\n').map(u => u.trim()).filter(u => u.length > 5);
    }

    function log(msg) {
        const div = document.createElement('div');
        div.textContent = `> ${msg}`;
        logArea.prepend(div);
    }

    function clearAll() {
        input.value = '';
        previewGrid.innerHTML = '';
        logArea.innerHTML = '';
        document.getElementById('progress-bar').style.display = 'none';
    }

    function renderPreview() {
        previewGrid.innerHTML = '';
        const urls = getUrls();
        if (urls.length === 0) return alert('请先输入链接');

        urls.forEach(url => {
            const img = document.createElement('img');
            img.className = 'preview-item';
            img.src = url;
            img.onerror = () => img.src = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect width="100" height="100" fill="%23f0f0f0"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-size="10" fill="%23999">加载失败</text></svg>';
            previewGrid.appendChild(img);
        });
        log(`预览已生成，共 ${urls.length} 张图片`);
    }

    async function runDownload() {
        const urls = getUrls();
        if (urls.length === 0) return alert('没有可下载的链接');

        const btn = document.getElementById('dl-btn');
        const bar = document.getElementById('progress-bar');
        const fill = document.getElementById('progress-fill');
        
        btn.disabled = true;
        bar.style.display = 'block';

        for (let i = 0; i < urls.length; i++) {
            const url = urls[i];
            fill.style.width = `${((i + 1) / urls.length) * 100}%`;
            
            try {
                const resp = await fetch(url);
                const blob = await resp.blob();
                const name = url.split('/').pop().split('?')[0] || `img_${Date.now()}.jpg`;
                
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = name.includes('.') ? name : name + '.jpg';
                a.click();
                URL.revokeObjectURL(a.href);
                log(`已下载: ${name}`);
            } catch (e) {
                log(`失败: ${url.substring(0,30)}... (CORS跨域限制)`);
                window.open(url, '_blank');
            }
            await new Promise(r => setTimeout(r, 800)); // 避免浏览器拦截
        }

        btn.disabled = false;
        btn.textContent = '完成';
        setTimeout(() => btn.textContent = '执行下载', 2000);
    }
</script>

</body>
</html>
