<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>图片下载器</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 12px;
  font-family: sans-serif;
}

textarea {
  width: 100%;
  min-height: 140px;
  padding: 12px;
  border-radius: 10px;
}

.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 10px 0;
}

button {
  padding: 10px;
  border-radius: 8px;
}

.item {
  border: 1px solid #ddd;
  border-radius: 10px;
  margin: 10px 0;
  padding: 10px;
}

img {
  width: 100%;
  max-height: 60vh;
  object-fit: contain;
  background: #eee;
}

.actions {
  display: flex;
  gap: 8px;
  margin: 6px 0;
}

#viewer {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.95);
  display: none;
  justify-content: center;
  align-items: center;
}

#viewer img {
  max-width: 100%;
  max-height: 100%;
}
</style>
</head>

<body>

<div id="mainPage">
  <textarea id="input" placeholder="每行一个图片链接"></textarea>

  <div class="toolbar">
    <button onclick="preview()">解析预览</button>
    <button onclick="downloadAll()">全部下载</button>
    <button onclick="clearAll()">清除</button>
    <button onclick="showHistory()">历史解析</button>
  </div>

  <div id="list"></div>
</div>

<div id="historyPage" style="display:none;">
  <div class="toolbar">
    <button onclick="back()">返回</button>
    <button onclick="clearHistory()">清空历史</button>
  </div>
  <div id="historyList"></div>
</div>

<div id="viewer" onclick="closeViewer()">
  <img id="viewerImg">
</div>

<script>
const input = document.getElementById('input');
const list = document.getElementById('list');
const viewer = document.getElementById('viewer');
const viewerImg = document.getElementById('viewerImg');

function extractUrls(text) {
  return (text.match(/https?:\/\/[^\s]+/g) || []);
}

function isSigned(url) {
  return url.includes("signature") || url.includes("x-goog");
}

function openViewer(url) {
  viewerImg.src = url;
  viewer.style.display = 'flex';
}

function closeViewer() {
  viewer.style.display = 'none';
}

function view(url, ok) {
  if (ok) openViewer(url);
  else window.open(url);
}

function download(url, name) {
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  a.target = "_blank";
  a.click();
}

function saveHistory(urls) {
  const old = JSON.parse(localStorage.getItem("img_history") || "[]");
  const merged = [...urls, ...old];
  localStorage.setItem("img_history", JSON.stringify(merged.slice(0, 200)));
}

function preview() {
  list.innerHTML = '';
  const urls = extractUrls(input.value);

  if (urls.length) saveHistory(urls);

  urls.forEach((url, i) => {
    const item = createItem(url, i);
    list.appendChild(item);
  });
}

function createItem(url, i, isHistory=false) {
  const item = document.createElement('div');
  item.className = 'item';

  const status = document.createElement('div');
  status.textContent = '加载中...';

  const actions = document.createElement('div');
  actions.className = 'actions';

  const viewBtn = document.createElement('button');
  viewBtn.textContent = '查看';

  const dlBtn = document.createElement('button');
  dlBtn.textContent = '下载';

  const delBtn = document.createElement('button');
  delBtn.textContent = '删除';

  const img = document.createElement('img');

  let ok = true;

  img.onload = () => status.textContent = '预览成功';
  img.onerror = () => {
    status.textContent = '无法预览';
    ok = false;
  };

  img.src = url;

  viewBtn.onclick = () => view(url, ok);
  dlBtn.onclick = () => download(url, `img_${i}.jpg`);

  actions.appendChild(viewBtn);
  actions.appendChild(dlBtn);

  if (isHistory) {
    delBtn.onclick = () => deleteHistory(url);
    actions.appendChild(delBtn);
  }

  item.appendChild(status);
  item.appendChild(actions);
  item.appendChild(img);

  return item;
}

async function downloadAll() {
  const urls = extractUrls(input.value);

  for (let i = 0; i < urls.length; i++) {
    if (isSigned(urls[i])) window.open(urls[i]);
    else download(urls[i], `img_${i}.jpg`);
    await new Promise(r => setTimeout(r, 800));
  }
}

function clearAll() {
  input.value = '';
  list.innerHTML = '';
}

/* ===== 历史功能 ===== */

function showHistory() {
  document.getElementById('mainPage').style.display = 'none';
  document.getElementById('historyPage').style.display = 'block';

  const data = JSON.parse(localStorage.getItem("img_history") || "[]");
  const historyList = document.getElementById('historyList');
  historyList.innerHTML = '';

  data.forEach((url, i) => {
    historyList.appendChild(createItem(url, i, true));
  });
}

function back() {
  document.getElementById('mainPage').style.display = 'block';
  document.getElementById('historyPage').style.display = 'none';
}

function clearHistory() {
  localStorage.removeItem("img_history");
  showHistory();
}

function deleteHistory(url) {
  let data = JSON.parse(localStorage.getItem("img_history") || "[]");
  data = data.filter(u => u !== url);
  localStorage.setItem("img_history", JSON.stringify(data));
  showHistory();
}
</script>

</body>
</html>
