<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>极简图片助手</title>
    <style>
        :root { --primary: #4a90e2; --bg: #f8fafe; }
        body { font-family: system-ui, sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 20px; }
        .card { background: white; width: 100%; max-width: 800px; padding: 24px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        h1 { font-size: 1.25rem; text-align: center; margin-bottom: 20px; color: #333; }
        textarea { width: 100%; height: 120px; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-family: monospace; }
        .btn-group { display: flex; gap: 10px; margin: 15px 0; }
        button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-preview { background: #5c6bc0; color: white; }
        .btn-download { background: var(--primary); color: white; }
        .btn-clear { background: #eee; color: #666; flex: 0.3; }
        button:hover { filter: brightness(0.9); }
        button:disabled { background: #ccc; }
        #preview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: 20px; }
        .preview-item { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; background: #eee; }
        #log { margin-top: 15px; font-size: 12px; color: #888; border-top: 1px solid #eee; padding-top: 10px; line-height: 1.6; }
    </style>
</head>
<body>

<div class="card">
    <h1>图片批量下载 & 预览</h1>
    <textarea id="input" placeholder="请粘贴图片链接..."></textarea>

    <div class="btn-group">
        <button class="btn-clear" onclick="clearAll()">清空</button>
        <button class="btn-preview" onclick="renderPreview()">预览 (绕过防盗链)</button>
        <button class="btn-download" id="dl-btn" onclick="runDownload()">伪装下载</button>
    </div>

    <div id="preview-grid"></div>
    <div id="log"></div>
</div>

<script>
    const input = document.getElementById('input');
    const previewGrid = document.getElementById('preview-grid');
    const logArea = document.getElementById('log');

    function log(msg) {
        const div = document.createElement('div');
        div.textContent = `> ${msg}`;
        logArea.prepend(div);
    }

    function clearAll() {
        input.value = '';
        previewGrid.innerHTML = '';
        logArea.innerHTML = '';
    }

    // 改进预览：增加 referrerpolicy 属性
    function renderPreview() {
        previewGrid.innerHTML = '';
        const urls = input.value.split('\n').map(u => u.trim()).filter(u => u.length > 5);
        if (urls.length === 0) return;

        urls.forEach(url => {
            const img = document.createElement('img');
            img.className = 'preview-item';
            // 关键：单张图片请求也不发送 Referrer
            img.referrerPolicy = "no-referrer"; 
            img.src = url;
            img.onerror = () => {
                img.style.display = 'none';
                log(`无法预览 (可能存在跨域严格限制): ${url.substring(0,30)}...`);
            };
            previewGrid.appendChild(img);
        });
        log(`尝试加载 ${urls.length} 张预览图...`);
    }

    async function downloadWithFallback(url) {
        const name = url.split('/').pop().split('?')[0] || `img_${Date.now()}.jpg`;
        
        try {
            // 尝试 1: 使用 fetch (可重命名)
            const resp = await fetch(url, {
                method: 'GET',
                mode: 'cors', // 默认尝试 CORS
                credentials: 'omit'
            });
            
            if (resp.ok) {
                const blob = await resp.blob();
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = name.includes('.') ? name : name + '.jpg';
                a.click();
                return true;
            }
        } catch (e) {
            // 尝试 2: fetch 失败（CORS 拦截），改用无来源直接跳转
            // 这是“伪装”的最后手段，由浏览器直接处理下载
            log(`CORS 受限，尝试直接唤起: ${name}`);
            const a = document.createElement('a');
            a.href = url;
            a.target = '_blank';
            a.rel = 'noreferrer'; // 确保不带来源
            a.download = name; 
            a.click();
            return true;
        }
        return false;
    }

    async function runDownload() {
        const urls = input.value.split('\n').map(u => u.trim()).filter(u => u.length > 5);
        const btn = document.getElementById('dl-btn');
        
        btn.disabled = true;
        for (let i = 0; i < urls.length; i++) {
            await downloadWithFallback(urls[i]);
            // 随机间隔模拟人类行为 (500ms - 1200ms)
            await new Promise(r => setTimeout(r, 500 + Math.random() * 700));
        }
        btn.disabled = false;
        log("下载任务已全部触发");
    }
</script>

</body>
</html>
