<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>图片助手 Pro</title>
    <style>
        :root { --primary: #5c7cfa; --bg: #f1f3f5; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .card { background: white; width: 100%; max-width: 500px; padding: 20px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
        h2 { font-size: 1.1rem; text-align: center; color: #333; margin-top: 0; }
        textarea { width: 100%; height: 120px; border: 1px solid #dee2e6; border-radius: 8px; padding: 10px; box-sizing: border-box; font-family: monospace; font-size: 13px; background: #f8f9fa; }
        .btn-group { display: grid; grid-template-columns: 0.6fr 1fr 1fr; gap: 8px; margin: 15px 0; }
        button { padding: 12px 5px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .btn-clear { background: #e9ecef; color: #495057; }
        .btn-preview { background: #748ffc; color: white; }
        .btn-download { background: var(--primary); color: white; }
        #preview-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 15px; }
        .p-item { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 4px; background: #eee; }
        #log { margin-top: 15px; font-size: 11px; color: #868e96; max-height: 100px; overflow-y: auto; border-top: 1px solid #eee; padding-top: 10px; }
        .status-tag { display: block; text-align: center; font-size: 12px; color: #fa5252; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h2>图片批量下载</h2>
    <span class="status-tag">注：文件将保存至系统 Download 文件夹</span>
    
    <textarea id="input" placeholder="请在此粘贴链接..."></textarea>

    <div class="btn-group">
        <button class="btn-clear" onclick="clearAll()">清空</button>
        <button class="btn-preview" onclick="renderPreview()">生成预览</button>
        <button class="btn-download" id="dl-btn" onclick="startTask()">开始下载</button>
    </div>

    <div id="preview-grid"></div>
    <div id="log"></div>
</div>

<script>
    const input = document.getElementById('input');
    const logArea = document.getElementById('log');

    function log(msg) {
        const d = new Date();
        const time = `${d.getHours()}:${d.getMinutes()}:${d.getSeconds()}`;
        logArea.insertAdjacentHTML('afterbegin', `<div>[${time}] ${msg}</div>`);
    }

    function clearAll() {
        input.value = '';
        document.getElementById('preview-grid').innerHTML = '';
        logArea.innerHTML = '已清空';
    }

    function renderPreview() {
        const grid = document.getElementById('preview-grid');
        grid.innerHTML = '';
        const urls = input.value.split('\n').filter(u => u.trim().length > 10);
        
        urls.forEach(url => {
            const img = document.createElement('img');
            img.className = 'p-item';
            img.referrerPolicy = "no-referrer";
            img.src = url.trim();
            img.onclick = () => window.open(url, '_blank'); // 点击可直接打开原图
            grid.appendChild(img);
        });
        log(`已尝试加载 ${urls.length} 个预览`);
    }

    // 终极下载逻辑
    async function forceDownload(url) {
        const fileName = `AI_IMG_${Date.now()}_${Math.floor(Math.random()*1000)}.jpg`;
        
        try {
            // 尝试 A: 跨域获取
            const response = await fetch(url, { method: 'GET', mode: 'cors' });
            if (response.ok) {
                const blob = await response.blob();
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = fileName;
                link.click();
                log(`✅ 成功获取: ${fileName}`);
                return;
            }
        } catch (e) {
            // 尝试 B: 直接通过浏览器下载链接 (针对 Google 签名链接最有效)
            log(`⚠️ 跨域受限，尝试唤起系统下载...`);
            const a = document.createElement('a');
            a.href = url;
            a.target = '_blank'; // 安卓上通常会触发下载或预览
            a.rel = 'noreferrer';
            a.download = fileName; 
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    }

    async function startTask() {
        const urls = input.value.split('\n').filter(u => u.trim().length > 10);
        if (urls.length === 0) return alert('请先输入链接');

        const btn = document.getElementById('dl-btn');
        btn.disabled = true;
        btn.textContent = '处理中...';

        for (let i = 0; i < urls.length; i++) {
            log(`正在处理第 ${i+1}/${urls.length} 张...`);
            await forceDownload(urls[i].trim());
            // 间隔 1 秒，防止请求过快被 Google 封锁
            await new Promise(r => setTimeout(r, 1000));
        }

        btn.disabled = false;
        btn.textContent = '开始下载';
        log('🎉 任务执行完毕，请查看通知栏或 Download 文件夹');
    }
</script>

</body>
</html>
