<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片下载器（移动优化版）</title>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

<style>
body { font-family: sans-serif; padding: 10px; }
textarea { width: 100%; height: 120px; font-size: 14px; }
button { margin: 5px; padding: 10px; font-size: 16px; }
.item { display: flex; align-items: center; margin: 10px 0; }
img { width: 70px; height: 70px; object-fit: cover; background: #eee; }
.status { font-size: 12px; color: #666; margin-left: 10px; }
</style>
</head>
<body>

<h3>📥 图片批量下载（移动优化）</h3>

<textarea id="input" placeholder="每行一个图片链接"></textarea><br>

<button onclick="preview()">解析预览</button>
<button onclick="downloadZip()">打包下载ZIP</button>

<div id="list"></div>
<div id="log"></div>

<script>
const input = document.getElementById('input');
const list = document.getElementById('list');
const logArea = document.getElementById('log');

function log(msg) {
  logArea.innerHTML = msg + "<br>" + logArea.innerHTML;
}

function getExt(type, url) {
  if (type.includes('png')) return 'png';
  if (type.includes('gif')) return 'gif';
  if (type.includes('webp')) return 'webp';
  if (type.includes('jpeg')) return 'jpg';

  if (url.endsWith('.png')) return 'png';
  if (url.endsWith('.gif')) return 'gif';
  if (url.endsWith('.webp')) return 'webp';

  return 'jpg';
}

async function fetchImage(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error();
  return await res.blob();
}

// 限制并发
async function pool(limit, tasks) {
  const ret = [];
  const executing = [];

  for (const task of tasks) {
    const p = task().then(res => {
      executing.splice(executing.indexOf(p), 1);
      return res;
    });
    ret.push(p);
    executing.push(p);

    if (executing.length >= limit) {
      await Promise.race(executing);
    }
  }

  return Promise.all(ret);
}

async function preview() {
  list.innerHTML = '';

  const urls = input.value.split('\n').map(x => x.trim()).filter(Boolean);

  urls.forEach(url => {
    const div = document.createElement('div');
    div.className = 'item';

    const img = document.createElement('img');
    const status = document.createElement('div');
    status.className = 'status';
    status.textContent = '加载中...';

    div.appendChild(img);
    div.appendChild(status);
    list.appendChild(div);

    fetchImage(url)
      .then(blob => {
        const u = URL.createObjectURL(blob);
        img.src = u;
        status.textContent = '✔ 成功';

        setTimeout(() => URL.revokeObjectURL(u), 5000);
      })
      .catch(() => {
        status.textContent = '❌ 失败';
      });
  });
}

async function downloadZip() {
  const urls = input.value.split('\n').map(x => x.trim()).filter(Boolean);

  const zip = new JSZip();

  const tasks = urls.map((url, i) => async () => {
    try {
      const blob = await fetchImage(url);
      const ext = getExt(blob.type, url);
      zip.file(`img_${i}.${ext}`, blob);
      log(`✔ ${i}`);
    } catch {
      log(`❌ 失败: ${url}`);
    }
  });

  await pool(3, tasks); // 并发3个

  const content = await zip.generateAsync({ type: "blob" });

  const a = document.createElement('a');
  const url = URL.createObjectURL(content);

  a.href = url;
  a.download = "images.zip";
  a.click();

  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
</script>

</body>
</html>
